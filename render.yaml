services:
  - type: web
    name: fleetmind-backend
    env: python
    rootDir: Fleetmind 10.0 FINAL/backend
    buildCommand: pip install -r requirements.txt && python scripts/generate_map.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

